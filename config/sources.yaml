# ANVESHAK — Source Configuration
# Defines the available astronomical data sources and their adapters.

sources:
  - id: "tess"
    name: "TESS Archive"
    type: "lightcurve"
    adapter: "tess"
    enabled: true

  - id: "kepler"
    name: "Kepler Archive"
    type: "lightcurve"
    adapter: "kepler"
    enabled: false

  - id: "synthetic"
    name: "Synthetic Demo"
    type: "lightcurve"
    adapter: "synthetic"
    enabled: true

  - id: "radio_demo"
    name: "Radio Demo"
    type: "radio"
    adapter: "radio_demo"
    enabled: true
